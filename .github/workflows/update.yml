name: Update Packtray cask

on:
  # Run it by hand right after a release (gh workflow run update.yml -R packtray/homebrew-tap).
  # The daily run is a fallback: GitHub switches off schedules in a public repo after 60
  # days without a commit, which is likely between releases. A run that finds the cask
  # already current stops there and downloads nothing.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@v4

      - name: Read the latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$RUNNER_TEMP/packtray-release.json"
          api_url="https://api.github.com/repos/packtray/releases/releases/latest"
          status="000"
          curl_status=0
          for attempt in 1 2 3 4; do
            set +e
            status="$(curl --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --connect-timeout 10 --max-time 30 \
              --output "$release_json" --write-out '%{http_code}' "$api_url")"
            curl_status=$?
            set -e

            if [[ "$curl_status" -eq 0 && ( "$status" == "200" || "$status" == "404" ) ]]; then
              break
            fi

            if [[ "$status" != "000" && "$status" != "403" && "$status" != "429" && "$status" -lt 500 ]]; then
              echo "::error::GitHub release API returned HTTP $status. Response:"
              head -c 2000 "$release_json" || true
              exit 1
            fi

            if [[ "$attempt" -eq 4 ]]; then
              echo "::error::GitHub release API request failed after $attempt attempts (curl exit $curl_status, HTTP $status)."
              head -c 2000 "$release_json" || true
              exit 1
            fi

            delay=$((attempt * 2))
            echo "GitHub release API request failed (curl exit $curl_status, HTTP $status); retrying in ${delay}s ($attempt/4)."
            sleep "$delay"
          done

          if [[ "$status" == 404 ]]; then
            echo "No stable Packtray release exists yet; leaving the tap unchanged."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$status" != "200" ]]; then
            echo "::error::Unexpected GitHub release API response: HTTP $status. Response:"
            head -c 2000 "$release_json" || true
            exit 1
          fi

          if ! ruby -rjson -e 'release = JSON.parse(File.read(ARGV.fetch(0))); abort "response is not a release object" unless release.is_a?(Hash) && release["tag_name"].is_a?(String) && [true, false].include?(release["prerelease"])' "$release_json"; then
            echo "::error::GitHub release API returned invalid release JSON. Response:"
            head -c 2000 "$release_json" || true
            exit 1
          fi

          prerelease="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0)))["prerelease"]' "$release_json")"
          if [[ "$prerelease" != "false" ]]; then
            echo "Latest release is a pre-release; leaving the tap unchanged."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0)))["tag_name"]' "$release_json")"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest stable release has an unexpected tag: $tag"
            exit 1
          fi
          version="${tag#v}"

          # Between releases the cask already has this version, which is nearly every
          # scheduled run. Stop before the download then: GitHub counts each fetch of a
          # release file as a download, and that count is how Packtray's downloads are
          # measured, so a daily fetch here reads as a visitor a day. A published release's
          # files can't be replaced, so the version settles it; the checksum GitHub reports
          # for the file is compared as well, when the API gives one.
          cask_version="$(ruby -e 'puts File.read(ARGV.fetch(0))[/^\s*version\s+"([^"]+)"/, 1].to_s' Casks/packtray.rb 2>/dev/null || true)"
          cask_sha256="$(ruby -e 'puts File.read(ARGV.fetch(0))[/^\s*sha256\s+"([^"]+)"/, 1].to_s' Casks/packtray.rb 2>/dev/null || true)"
          release_sha256="$(ruby -rjson -e 'asset = JSON.parse(File.read(ARGV.fetch(0))).fetch("assets", []).find { |a| a["name"] == "Packtray.dmg" } || {}; puts asset["digest"].to_s.delete_prefix("sha256:")' "$release_json")"
          if [[ "$cask_version" == "$version" && ( -z "$release_sha256" || "$release_sha256" == "$cask_sha256" ) ]]; then
            echo "The cask already has Packtray $version; nothing to download."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url="https://github.com/packtray/releases/releases/download/${tag}/Packtray.dmg"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            --connect-timeout 10 --max-time 300 "$url" -o "$RUNNER_TEMP/Packtray.dmg"
          sha256="$(shasum -a 256 "$RUNNER_TEMP/Packtray.dmg" | cut -d ' ' -f 1)"
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "version=$version"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Write the cask
        if: steps.release.outputs.skip != 'true'
        run: ruby scripts/update_cask.rb Casks/packtray.rb "${{ steps.release.outputs.version }}" "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.sha256 }}"

      - name: Validate the cask
        if: steps.release.outputs.skip != 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap packtray/tap "$GITHUB_WORKSPACE"
          # The tap is a clone of the last commit, so it still holds the cask from before this
          # update: copy the new one in, or the audit checks the old version.
          cp Casks/packtray.rb "$(brew --repository packtray/tap)/Casks/packtray.rb"
          # --new, minus the one check meant for Homebrew's own list: that the download's
          # GitHub repo is popular (75 stars, 30 forks or 30 watchers). packtray/releases
          # isn't, so it would stop every update.
          HOMEBREW_NO_AUTO_UPDATE=1 brew audit --cask --new --except github_repository packtray/tap/packtray

      - name: Commit the new version
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "packtray-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/packtray.rb
          if git diff --cached --quiet; then
            echo "Cask is already current."
            exit 0
          fi
          git commit -m "packtray ${{ steps.release.outputs.version }}"
          git push
